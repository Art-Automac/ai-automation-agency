version: "3.8"

services:
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    environment:
      - TZ=America/Sao_Paulo
      - PYTHONPATH=/app:/app/api
      - ONNX_NUM_THREADS=8
      - ONNX_INTER_OP_THREADS=4
      - ONNX_EXECUTION_MODE=parallel
      - ONNX_OPTIMIZATION_LEVEL=all
      - ONNX_MEMORY_PATTERN=true
      - ONNX_ARENA_EXTEND_STRATEGY=kNextPowerOfTwo
      - API_LOG_LEVEL=INFO
      - API_KEY=${KOKORO_API_KEY}
    networks:
      - network_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == worker1
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          memory: 2G
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        
        # Roteador da API
        - "traefik.http.routers.kokoro-api.rule=Host(`${TRAEFIK_HOST}`) && PathPrefix(`/v1`)"
        - "traefik.http.routers.kokoro-api.entrypoints=websecure"
        - "traefik.http.routers.kokoro-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.kokoro-api.service=kokoro-tts-svc"
        
        # Roteador do Painel Web
        - "traefik.http.routers.kokoro-ui.rule=Host(`${TRAEFIK_HOST}`)"
        - "traefik.http.routers.kokoro-ui.entrypoints=websecure"
        - "traefik.http.routers.kokoro-ui.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.kokoro-ui.middlewares=kokoro-basic-auth"
        - "traefik.http.routers.kokoro-ui.service=kokoro-tts-svc"
        
        # Middleware com placeholder que será substituído no pipeline
        - "traefik.http.middlewares.kokoro-basic-auth.basicauth.users=__BASIC_AUTH__"
        
        - "traefik.http.services.kokoro-tts-svc.loadbalancer.server.port=8880"

networks:
  network_public:
    external: true
