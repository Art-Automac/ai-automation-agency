version: "3.8"

services:
  pgadmin:
    image: dpage/pgadmin4:8.9
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
      - TZ=America/Sao_Paulo
      - PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - network_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1G
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.pgadmin.rule=Host(`${PGADMIN_DOMAIN}`)
        - traefik.http.routers.pgadmin.entrypoints=websecure
        - traefik.http.routers.pgadmin.tls=true
        - traefik.http.routers.pgadmin.tls.certresolver=letsencryptresolver
        - traefik.http.services.pgadmin.loadbalancer.server.port=80
        - traefik.http.services.pgadmin.loadbalancer.passhostheader=true
        - traefik.http.middlewares.pgadmin-headers.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.pgadmin.middlewares=pgadmin-headers@docker

networks:
  network_public:
    external: true

volumes:
  pgadmin_data:
    external: true
    name: postgres_pgadmin_data
