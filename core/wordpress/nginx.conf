worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Oculta versão do Nginx
    server_tokens off;

    # Compressão otimizada
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    server {
        listen 80;
        server_name _;

        root /var/www/html;
        index index.php index.html;

        autoindex off;

        resolver 127.0.0.11 valid=30s;

        # ====================================================================
        # REGRAS DE SEGURANÇA E BLOQUEIO DE ATAQUES (PHP & WORDPRESS)
        # ====================================================================

        # 1. Bloqueia xmlrpc.php (ataques de força bruta e amplificação DDoS)
        location = /xmlrpc.php {
            deny all;
            access_log off;
            log_not_found off;
            return 403;
        }

        # 2. Bloqueia execução de PHP na pasta uploads (mata webshells e backdoors)
        location ~* ^/wp-content/uploads/.*\.php$ {
            deny all;
            access_log off;
            log_not_found off;
            return 403;
        }

        # 3. Bloqueia acesso a arquivos ocultos, backups e configs (.git, .env, wp-config.php)
        location ~* /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
            return 403;
        }

        location = /wp-config.php {
            deny all;
            access_log off;
            log_not_found off;
            return 403;
        }

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            set $upstream wordpress:9000;

            fastcgi_pass $upstream;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires max;
            log_not_found off;
        }
    }
}
