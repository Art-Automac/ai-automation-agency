version: "3.8"

services:

  mariadb-exporter:

    image: prom/mysqld-exporter:v0.20.0

    environment:
      MYSQLD_EXPORTER_PASSWORD: "${MYSQL_PASSWORD}"

    command:
      - "--mysqld.address=mariadb:${MYSQL_PORT}"
      - "--mysqld.username=${MYSQL_USER}"
      - "--exporter.max_open_connections=2"

    networks:
      - wp_internal
      - network_public

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:

  wp_internal:
    external: true

  network_public:
    external: true